<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Title & Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* CSS Keyframe Animations for Dynamic Aspect */
    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.2; }
      100% { transform: scale(1.04); opacity: 0.45; }
    }
    @keyframes flow {
      from { stroke-dashoffset: 300; }
      to { stroke-dashoffset: 0; }
    }

    .pulse-circle-1 {
      animation: pulse 4s ease-in-out infinite alternate;
      transform-origin: 150px 100px;
    }
    .pulse-circle-2 {
      animation: pulse 5s ease-in-out infinite alternate;
      transform-origin: 1050px 300px;
    }
    .flow-line {
      stroke-dasharray: 12, 16;
      animation: flow 25s linear infinite;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Background Dynamic / Animated Elements (Stays behind title/subtitle frame) -->
  <g opacity="0.3">
    <circle cx="150" cy="100" r="180" fill="#38bdf8" class="pulse-circle-1" />
    <circle cx="1050" cy="300" r="220" fill="#c084fc" class="pulse-circle-2" />

    <!-- Infrastructure Flow Line Graphs -->
    <path d="M 50 350 Q 300 180 600 280 T 1150 80" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" class="flow-line" />
    <path d="M 30 80 Q 400 320 800 140 T 1170 330" fill="none" stroke="#818cf8" stroke-width="2" class="flow-line" />
  </g>

  <!-- Decorative Outer Tech Pills (Positioned around borders away from main text) -->
  <g transform="translate(80, 40)">
    <rect width="150" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="75" y="21" text-anchor="middle" class="badge-text">⚙️ IaC Automation</text>
  </g>

  <g transform="translate(970, 40)">
    <rect width="150" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="75" y="21" text-anchor="middle" class="badge-text">☸️ Kubernetes IDP</text>
  </g>

  <g transform="translate(970, 328)">
    <rect width="150" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <text x="75" y="21" text-anchor="middle" class="badge-text">🚀 Golden Paths</text>
  </g>

  <g transform="translate(80, 328)">
    <rect width="150" height="32" rx="16" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5" />
    <text x="75" y="21" text-anchor="middle" class="badge-text">📦 Self-Service</text>
  </g>

  <!-- Foreground Main Title Card Container -->
  <g transform="translate(100, 105)">
    <rect width="1000" height="190" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- Foreground Title -->
    <text x="500" y="62" text-anchor="middle" class="title">
      Awesome Automated Infrastructure Delivery
    </text>

    <!-- Subtitle -->
    <text x="500" y="102" text-anchor="middle" class="subtitle">
      Internal Developer Platforms (IDP), Self-Service Workflows &amp; Orchestration for Microservices
    </text>

    <!-- Key Pillars Pills inside Main Card Frame -->
    <g transform="translate(200, 132)">
      <rect width="170" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="85" y="21" text-anchor="middle" class="badge-text">🏢 Commercial IDPs</text>
    </g>

    <g transform="translate(395, 132)">
      <rect width="190" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="95" y="21" text-anchor="middle" class="badge-text">🔓 Open-Source Tools</text>
    </g>

    <g transform="translate(610, 132)">
      <rect width="190" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="95" y="21" text-anchor="middle" class="badge-text">⚡ Ephemeral Envs</text>
    </g>
  </g>
</svg>
