<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#161b22"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient></defs><style>@keyframes pulse{0%{transform:scale(.98);opacity:.2}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:38px;fill:url(#titleGrad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.pulse-circle-1{animation:pulse 4s ease-in-out infinite alternate;transform-origin:150px 100px}.pulse-circle-2{animation:pulse 5s ease-in-out infinite alternate;transform-origin:1050px 300px}.flow-line{stroke-dasharray:12,16;animation:flow 25s linear infinite}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><g opacity=".3"><circle cx="150" cy="100" r="180" fill="#38bdf8" class="pulse-circle-1"/><circle cx="1050" cy="300" r="220" fill="#c084fc" class="pulse-circle-2"/><path fill="none" stroke="url(#accentGrad)" stroke-width="2.5" d="M 50 350 Q 300 180 600 280 T 1150 80" class="flow-line"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 30 80 Q 400 320 800 140 T 1170 330" class="flow-line"/></g><g transform="translate(80, 40)"><rect width="150" height="32" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="16"/><text x="75" y="21" class="badge-text" text-anchor="middle">⚙️ IaC Automation</text></g><g transform="translate(970, 4