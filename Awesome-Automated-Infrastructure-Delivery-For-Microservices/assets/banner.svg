<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Text & Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 38px; fill: url(#titleGrad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }

    /* Animated background elements (subtle & non-intrusive in background) */
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 10, 15;
      animation: flow 20s linear infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.15; }
      100% { transform: scale(1.05); opacity: 0.35; }
    }
    @keyframes flow {
      from { stroke-dashoffset: 300; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Background Dynamic Animations (behind cards/text) -->
  <g opacity="0.25">
    <circle cx="150" cy="100" r="180" fill="#38bdf8" class="pulse-circle" filter="url(#glow)" />
    <circle cx="1050" cy="300" r="220" fill="#c084fc" class="pulse-circle" filter="url(#glow)" />

    <!-- Network / Delivery Infrastructure Grid Lines -->
    <path d="M 100 350 Q 300 200 600 300 T 1100 100" fill="none" stroke="url(#accentGrad)" stroke-width="2" class="flow-line" />
    <path d="M 50 100 Q 400 300 800 150 T 1150 320" fill="none" stroke="#818cf8" stroke-width="1.5" class="flow-line" />
  </g>

  <!-- Interactive Decorative Floating Tech Pills (Positioned around borders) -->
  <g transform="translate(100, 45)" filter="url(#glow)">
    <rect width="140" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="70" y="21" text-anchor="middle" class="badge-text">⚙️ IaC Templates</text>
  </g>

  <g transform="translate(960, 45)" filter="url(#glow)">
    <rect width="150" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="75" y="21" text-anchor="middle" class="badge-text">☸️ Kubernetes IDP</text>
  </g>

  <g transform="translate(970, 320)" filter="url(#glow)">
    <rect width="140" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <text x="70" y="21" text-anchor="middle" class="badge-text">🚀 Golden Paths</text>
  </g>

  <!-- Foreground Main Title Card Container -->
  <g transform="translate(100, 110)">
    <rect width="1000" height="190" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="2" filter="url(#glow)" />

    <!-- Main Title (Guaranteed foreground visibility) -->
    <text x="500" y="65" text-anchor="middle" class="title" filter="url(#glow)">
      Awesome Automated Infrastructure Delivery
    </text>

    <!-- Subtitle -->
    <text x="500" y="105" text-anchor="middle" class="subtitle">
      Internal Developer Platforms (IDP), Self-Service Workflows &amp; Orchestration for Microservices
    </text>

    <!-- Key Pillars Pills inside Foreground Frame -->
    <g transform="translate(210, 132)">
      <rect width="160" height="30" rx="15" fill="#1e293b" stroke="#475569" />
      <text x="80" y="20" text-anchor="middle" class="badge-text">🏢 Commercial IDPs</text>
    </g>
    <g transform="translate(390, 132)">
      <rect width="180" height="30" rx="15" fill="#1e293b" stroke="#475569" />
      <text x="90" y="20" text-anchor="middle" class="badge-text">🔓 Open-Source Tools</text>
    </g>
    <g transform="translate(590, 132)">
      <rect width="200" height="30" rx="15" fill="#1e293b" stroke="#475569" />
      <text x="100" y="20" text-anchor="middle" class="badge-text">⚡ Ephemeral Envs</text>
    </g>
  </g>
</svg>
